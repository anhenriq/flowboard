<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FlowBoard – Simple Kanban Board for Tracking Work</title>
    <meta name="description" content="FlowBoard is a simple Kanban board. Sign in to organize tasks across Backlog, In Progress, In Review and Done, with priorities, due dates and assignees." />
    <meta name="robots" content="index, follow, max-image-preview:large" />
    <meta name="theme-color" content="#0369a1" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="FlowBoard" />
    <meta property="og:title" content="FlowBoard – Simple Kanban Board for Tracking Work" />

    <meta property="og:locale" content="en_US" />

    <meta name="twitter:description" content="Organize tasks across Backlog, In Progress, In Review and Done, with priorities, due dates and assignees." />

  </head>
  <body>
    <div id="root">
      <!-- Crawlers and AI engines that don't run JavaScript read this; React replaces it on load. -->
      <main>
        <h1>FlowBoard</h1>
        <p>
          FlowBoard is a simple Kanban board for tracking work from backlog to done. Create cards with a
          title, assignee, priority and due date, and move them across Backlog, In Progress, In Review
          and Done. Sign in or create a free account to start.
        </p>
      </main>
    </div>
    <noscript>FlowBoard needs JavaScript to run. Please enable JavaScript to use the board.</noscript>
    <script type="module" src="/src/main.tsx"></script>
